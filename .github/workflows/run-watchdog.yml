name: run-watchdog
# Monitor only: fails (so GitHub emails the repository owner) when the morning ratings or the evening results capture did not
# reach the repository. It never runs, fixes or publishes anything itself.
on:
  schedule:
    - cron: '50 22 * * *'   # 08:50 Brisbane: today's morning run should have published
    - cron: '45 14 * * *'   # 00:45 Brisbane: yesterday's evening capture should be saved
    - cron: '15 22 * * *'   # 08:15 Brisbane: PC collector checks (only once pc_collector/ENABLED exists)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          H=$(TZ=Australia/Brisbane date +%H); M=$(TZ=Australia/Brisbane date +%M); T=$(TZ=Australia/Brisbane date +%Y%m%d); Y=$(TZ=Australia/Brisbane date -d yesterday +%Y%m%d)
          if [ "$H" = 08 ] && [ "$M" -lt 40 ] && [ "${{ github.event_name }}" = schedule ]; then
            # PC collector: this morning's racecards and last night's final results must be on branch pc-collect, verified.
            if [ ! -f pc_collector/ENABLED ]; then echo "PC collector not enabled yet: nothing to check"; exit 0; fi
            git fetch -q --depth 1 origin pc-collect || { echo "::error::PC COLLECTOR: branch pc-collect unreadable"; exit 1; }
            bad=0
            for spec in "$T morning" "$Y evening"; do set -- $spec
              m=$(git show FETCH_HEAD:pc/$1/$2_manifest.json 2>/dev/null) || { echo "::error::PC COLLECTOR: no $2 delivery for $1"; bad=1; continue; }
              echo "$m" | python3 -c "import sys,json; m=json.load(sys.stdin); ok=m.get('delivered_verified') and m.get('complete'); print('$2 $1:', 'complete' if ok else 'INCOMPLETE', {k: m.get(k) for k in ('late','races_fetched','races_expected','unresolved','final_run')}); sys.exit(0 if ok else 1)" || { echo "::error::PC COLLECTOR: $2 $1 incomplete"; bad=1; }
            done
            for j in morning form evening; do git show FETCH_HEAD:pc/heartbeat/$j.json 2>/dev/null | python3 -c "import sys,json; h=json.load(sys.stdin); print('heartbeat $j:', h['utc'], 'ok' if h['ok'] else 'ERROR ' + h['error']); sys.exit(0 if h['ok'] else 1)" || { echo "::error::PC COLLECTOR: last $j run reported an error"; bad=1; }; done
            exit $bad
          fi
          if [ "$H" -ge 6 ] && [ "$H" -lt 20 ]; then
            L=research/ops/logs/$T.md
            if [ ! -f "$L" ]; then echo "::error::MORNING RUN MISSING: no $L by 08:50 Brisbane"; exit 1; fi
            if ! grep -qiE 'published|no thoroughbred|no racing' "$L"; then echo "::error::MORNING RUN INCOMPLETE: $L has no publish line"; grep -i attention "$L" || true; exit 1; fi
            grep -i attention "$L" && { echo "::error::MORNING RUN reported ATTENTION"; exit 1; } || true
            echo "morning run OK: $L"
          else
            Yi=$(TZ=Australia/Brisbane date -d yesterday +%F)
            if [ ! -f "research/ui/data/racing_$Yi.json" ]; then echo "no dashboard day for $Yi: nothing to capture"; exit 0; fi
            ls research/collect/national/$Y/results_*.raw.txt >/dev/null 2>&1 || { echo "::error::EVENING CAPTURE MISSING for $Y (results and final prices are lost once TAB drops the day)"; exit 1; }
            echo "evening capture OK: $(ls research/collect/national/$Y/results_*.raw.txt)"
          fi
