name: weekly-collector-test
# Push-triggered test of the GitHub-side weekly collectors: collects two recent days from Breednet and checks the result
# against the master database rows for the same meetings. Results go to branch ci-results (not main).
on:
  push:
    branches: [main]
    paths: ['collect/weekly/**', '.github/workflows/weekly-test.yml']
permissions:
  contents: write
concurrency: { group: weekly-db, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests beautifulsoup4 lxml duckdb pandas
      - name: Restore master database (branch db)
        run: |
          git fetch -q --depth 1 origin db:db
          mkdir -p /tmp/dbpack && git --work-tree=/tmp/dbpack checkout db -- .
          cd /tmp/dbpack && python3 -c "import json,hashlib,glob;m=json.load(open('MANIFEST.json'));[exit('sha mismatch '+p['file']) for p in m['parts'] if hashlib.sha256(open(p['file'],'rb').read()).hexdigest()!=p['sha256']];print('pack ok',m['version'])"
          cat master_db.tar.gz.part* | tar -xzf - -C "$GITHUB_WORKSPACE" history/history.duckdb
      - name: Collect 21-22 Nov 2026 (NSW, VIC, ACT) from Breednet
        run: python3 collect/weekly/breednet.py dates 2026-11-21 2026-11-22 /tmp/bn_test.jsonl.gz --states NSW,VIC,ACT 2>&1 | tee /tmp/collect.log
      - name: Compare with the master database
        if: always()
        run: python3 collect/weekly/compare_breednet.py /tmp/bn_test.jsonl.gz history/history.duckdb /tmp/parity.md 2>&1 | tee /tmp/compare.log || true
      - name: Save results to branch ci-results
        if: always()
        run: |
          mkdir -p /tmp/out && cp /tmp/parity.md /tmp/bn_test.stats.json /tmp/bn_test.jsonl.gz /tmp/collect.log /tmp/compare.log /tmp/out/ 2>/dev/null || true
          curl -s -A 'RacingIntelligence-private/0.2' https://www.breednet.com.au/robots.txt | head -60 > /tmp/out/breednet_robots.txt || true
          cd /tmp/out && git init -q && git checkout -q -b ci-results && mkdir -p weekly-test && mv -f *.* weekly-test/ 2>/dev/null; git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "weekly collector test $(date -u +%FT%TZ)"
          AUTH="$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)"
          git -c http.https://github.com/.extraheader="$AUTH" push -qf "https://github.com/${GITHUB_REPOSITORY}.git" ci-results
