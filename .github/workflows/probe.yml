name: probe-sources
# Can GitHub's servers reach each data source with ordinary, honestly identified requests?
# No browser impersonation, no custom Origin/Referer, no cookie replay. Results are committed to probe/results.txt.
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reachability
        run: |
          mkdir -p probe; OUT=probe/results.txt; : > $OUT
          D=$(TZ=Australia/Brisbane date +%F); DS=$(TZ=Australia/Brisbane date +%Y%m%d)
          UA="RacingIntelligence-private/0.1 (personal research; github.com/dejobrien000)"
          echo "run_utc=$(date -u +%FT%TZ) runner_ip=$(curl -s -m 10 https://api.ipify.org)" >> $OUT
          check() { r=$(curl -s -o /tmp/body -w '%{http_code}|%{size_download}|%{content_type}' -m 30 -A "$UA" "$1" 2>&1) || r="ERR $?"; echo "$2|$r|$(head -c 100 /tmp/body 2>/dev/null | tr -d '\n\r')" >> $OUT; }
          check "https://api.beta.tab.com.au/v1/tab-info-service/racing/dates/$D/meetings?jurisdiction=NSW" "TAB meetings"
          check "https://api.beta.tab.com.au/v1/tab-info-service/racing/dates/$D/meetings/R/GEL/races/1?jurisdiction=NSW" "TAB racecard"
          check "https://www.racingqueensland.com.au/racing/full-calendar/thoroughbred/meeting/ipsw/$DS" "Racing Queensland"
          check "https://mdata.racingnsw.com.au/FreeFields/Scratchings.aspx?Key=2026Nov25%2CNSW%2CWyong" "Racing NSW FreeFields"
          check "https://www.breednet.com.au/race-meeting/geel/251126/1" "Breednet"
          # 26 Nov 2026 re-probe: same honest User-Agent, plus an ordinary Accept header asking for JSON (not browser impersonation)
          checkj() { r=$(curl -s -o /tmp/body -w '%{http_code}|%{size_download}|%{content_type}' -m 30 -A "$UA" -H 'Accept: application/json' "$1" 2>&1) || r="ERR $?"; echo "$2|$r|$(head -c 100 /tmp/body 2>/dev/null | tr -d '\n\r')" >> $OUT; }
          checkj "https://api.beta.tab.com.au/v1/tab-info-service/racing/dates/$D/meetings?jurisdiction=NSW" "TAB meetings (Accept json)"
          check "https://api.beta.tab.com.au/robots.txt" "TAB api robots.txt"
          check "https://www.tab.com.au/robots.txt" "TAB www robots.txt"
          check "https://racing.racingnsw.com.au/robots.txt" "Racing NSW FreeFields robots.txt"
          check "https://racing.racingnsw.com.au/FreeFields/Race_Diary_Stewards.aspx" "Racing NSW stewards diary"
          check "https://www.racingnsw.com.au/robots.txt" "racingnsw.com.au robots.txt"
          check "https://www.racingnsw.com.au/wp-content/uploads/stewards_info/22082026NCLE.pdf" "Racing NSW stewards rundown PDF"
          check "https://www.racingaustralia.horse/robots.txt" "Racing Australia robots.txt"
          check "https://www.racingvictoria.com.au/robots.txt" "Racing Victoria robots.txt"
          check "https://www.racingvictoria.com.au/integrity/stewards/stewards-reports" "Racing Victoria stewards reports"
          check "https://www.racingqueensland.com.au/robots.txt" "Racing Queensland robots.txt"
          check "https://www.racingqueensland.com.au/racing/full-calendar/thoroughbred/meeting/ipsw/20260620/stewards-report" "RQ stewards report"
          # Racing SA answers 301: follow it (ordinary redirect) and save the pages so the gear-report links can be read
          follow() { r=$(curl -sL -o "$3" -w '%{http_code}|%{size_download}|%{content_type}|%{url_effective}' -m 40 -A "$UA" "$1" 2>&1) || r="ERR $?"; echo "$2 (followed)|$r" >> $OUT; }
          mkdir -p probe/bodies/sa
          follow "https://racingsa.com.au/robots.txt" "Racing SA robots.txt" probe/bodies/sa/robots.txt
          follow "https://racingsa.com.au/meeting/5185273" "Racing SA meeting page Gawler 7 Oct 24" probe/bodies/sa/meeting_5185273.html
          follow "https://racingsa.com.au/meetings/31-aug-24-morphettville" "Racing SA meeting page Morphettville 31 Aug 24" probe/bodies/sa/meeting_31aug24.html
          follow "https://racingsa.com.au/calendar" "Racing SA calendar" probe/bodies/sa/calendar.html
          follow "https://racingsa.com.au/files/21070_151123_mbr.pdf" "Racing SA gear PDF" probe/bodies/sa/gear_21070.pdf
          follow "https://www.countryracingsa.com.au/meeting/5185273" "Country Racing SA meeting page" probe/bodies/sa/country_meeting_5185273.html
          follow "https://www.countryracingsa.com.au/seo/xmlSitemap" "Country Racing SA sitemap" probe/bodies/sa/sitemap.xml
          follow "https://www.countryracingsa.com.au/calendar" "Country Racing SA calendar" probe/bodies/sa/country_calendar.html
          follow "https://www.countryracingsa.com.au/race/gear-changes/5399564" "Country Racing SA race gear-changes page" probe/bodies/sa/race_gear_5399564.html
          follow "https://www.countryracingsa.com.au/race/5399564" "Country Racing SA race page" probe/bodies/sa/race_5399564.html
          followz() { r=$(curl -sL --compressed -o "$3" -w '%{http_code}|%{size_download}|%{content_type}|%{url_effective}' -m 60 -A "$UA" "$1" 2>&1) || r="ERR $?"; echo "$2 (followed, compressed)|$r|$(stat -c%s "$3" 2>/dev/null) bytes unpacked" >> $OUT; }
          followz "https://www.countryracingsa.com.au/events/view/4474-gawler-18-11-2026" "Country Racing SA calendar event page" probe/bodies/sa/event_4474.html
          followz "https://www.countryracingsa.com.au/meeting/5185273" "Country Racing SA meeting page (compressed transfer)" probe/bodies/sa/meeting_z.html
          followz "https://www.countryracingsa.com.au/meeting/5185274" "Country Racing SA neighbouring id 5185274" probe/bodies/sa/meeting_5185274.html
          followz "https://www.countryracingsa.com.au/meeting/5172620" "Country Racing SA id of a Qld meeting (Toowoomba 29 Oct 22)" probe/bodies/sa/meeting_qld.html
          mkdir -p probe/bodies/nsw
          followz "https://www.racingnsw.com.au/wp-json/wp/v2/posts?search=stewards%20notifications&per_page=5&_fields=id,date,date_gmt,modified_gmt,link,title" "Racing NSW WordPress posts API (stewards notifications)" probe/bodies/nsw/posts.json
          followz "https://www.racingnsw.com.au/wp-json/wp/v2/media?search=stewards_info&per_page=5&_fields=id,date_gmt,source_url,title" "Racing NSW WordPress media API (stewards_info PDFs)" probe/bodies/nsw/media.json
          followz "https://www.racingnsw.com.au/wp-json/" "Racing NSW WordPress API index" probe/bodies/nsw/index.json
          followz "https://www.racingnsw.com.au/robots.txt" "Racing NSW www robots" probe/bodies/nsw/robots.txt
          for f in probe/bodies/nsw/*.json; do [ -s "$f" ] && [ $(stat -c%s "$f") -gt 200000 ] && { head -c 200000 "$f" > "$f.cut"; mv "$f.cut" "$f"; }; done
          for f in probe/bodies/sa/*.html probe/bodies/sa/*.xml; do [ -s "$f" ] && [ $(stat -c%s "$f") -gt 400000 ] && { head -c 400000 "$f" > "$f.cut"; mv "$f.cut" "$f"; }; done
          check "https://racingsa.com.au/robots.txt" "Racing SA robots.txt"
          check "https://www.countryracingsa.com.au/robots.txt" "Country Racing SA robots.txt"
          check "https://racingsa.com.au/meetings/31-aug-24-morphettville" "Racing SA meeting page (slug)"
          check "https://racingsa.com.au/meeting/5185273" "Racing SA meeting page (id)"
          check "https://racingsa.com.au/files/21070_151123_mbr.pdf" "Racing SA gear change PDF"
          check "https://countryracingsa.com.au/files/22661_231024_sbyn.pdf" "Country Racing SA gear change PDF"
          check "https://static.p.racingwa.com.au/robots.txt" "RWWA static robots.txt"
          check "https://www.racingwa.com.au/robots.txt" "Racing WA robots.txt"
          check "https://tasracing.com.au/robots.txt" "Tasracing robots.txt"
          mkdir -p probe/bodies; for u in "https://racingsa.com.au/robots.txt" "https://www.countryracingsa.com.au/robots.txt" "https://www.racingwa.com.au/robots.txt" "https://tasracing.com.au/robots.txt"; do
            f=probe/bodies/$(echo "$u" | sed 's#https://##; s#[/.]#_#g').txt; curl -s -m 30 -A "$UA" "$u" | head -c 20000 > "$f" || true; done
          for u in "https://api.beta.tab.com.au/robots.txt" "https://www.tab.com.au/robots.txt" "https://racing.racingnsw.com.au/robots.txt" "https://www.racingnsw.com.au/robots.txt" "https://www.racingaustralia.horse/robots.txt" "https://www.racingvictoria.com.au/robots.txt" "https://www.racingqueensland.com.au/robots.txt"; do
            f=probe/bodies/$(echo "$u" | sed 's#https://##; s#[/.]#_#g').txt; curl -s -m 30 -A "$UA" "$u" | head -c 20000 > "$f" || true; done
          cat $OUT
      - name: Save results
        run: |
          git config user.name 'github-actions'; git config user.email 'github-actions@users.noreply.github.com'
          git add -A probe && git commit -m 'probe results' && git push
