name: rqstewards-probe
on:
  push:
    paths: ['collect/rqstewards/probe.py', '.github/workflows/rqstewards-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python3 collect/rqstewards/probe.py
      - name: Save to orphan branch raw-rqstewards-probe
        run: |
          mkdir /tmp/o && cp -r probe_out /tmp/o/ && cd /tmp/o && git init -q && git checkout -q -b raw-rqstewards-probe
          git config user.name 'github-actions'; git config user.email 'github-actions@users.noreply.github.com'
          git add -A && git commit -qm "rq stewards probe $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" raw-rqstewards-probe
