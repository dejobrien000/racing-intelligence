name: weekly-master-db
# ONE weekly incremental update of the master database (branch db). Manual until the collectors are ported
# (research/ops/weekly_update.py says what is done); the Monday schedule is switched on once a dry run passes.
on:
  workflow_dispatch:
    inputs:
      dry_run: {description: 'Do not publish a new database version', default: 'true'}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Restore current master database
        run: |
          git fetch --depth 1 origin db && git worktree add /tmp/db origin/db
          python3 -c "import json,hashlib;m=json.load(open('/tmp/db/MANIFEST.json'));[exec('assert hashlib.sha256(open(\"/tmp/db/\"+p[\"file\"],\"rb\").read()).hexdigest()==p[\"sha256\"]') for p in m['parts']];print(m['version'])"
          cat /tmp/db/master_db.tar.gz.part* | tar -xzf - -C .
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy duckdb pyarrow scipy statsmodels scikit-learn requests lxml
      - name: Incremental update (new or corrected records only)
        run: cd research && python3 ops/weekly_update.py
      - name: Publish new version (keeps previous on db-prev)
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          V=master-$(python3 -c "import duckdb;print(duckdb.connect('history/history.duckdb',read_only=True).execute('select max(meeting_date) from bn_meeting').fetchone()[0])")
          git push origin origin/db:refs/heads/db-prev --force
          mkdir /tmp/new && tar -czf - history/history.duckdb research/*.parquet research/engine/frames/national.parquet | split -b 45m -d -a 2 - /tmp/new/master_db.tar.gz.part
          cd /tmp/new && python3 -c "import json,hashlib,glob,os;json.dump({'version':'$V','parts':[{'file':os.path.basename(p),'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest()} for p in sorted(glob.glob('master_db.tar.gz.part*'))]},open('MANIFEST.json','w'),indent=1)"
          git init -q -b db && git add -A && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "$V"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} db
