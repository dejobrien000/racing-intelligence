<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racing Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work: a professional race-day research terminal, calm and exact
   IDEA the printed race book and the course's own form board: ruled rows, saddlecloth numbers, a rail
   PICTURE the day's board of assessments (calibrated chance with its band) and, per race, the field laid along a rating rail
   COLOUR night-track charcoal ground; turf green = strong, sky = leading contender, slate = no clear edge, coral = against
   TYPE Archivo (display, race-book weight) + Inter (text, tabular figures)
   LAYOUT top bar + tabs; board first; on a phone every table becomes stacked cards, detail opens as a full sheet */
:root{color-scheme:dark;--bg:#0b1016;--panel:#111a23;--panel2:#162230;--line:#22313f;--ink:#e8eef3;--mute:#97a5b2;--faint:#64737f;--turf:#4fc48f;--sky:#76b4e9;--slate:#8c99a6;--coral:#ec806e;--chip:#1b2836}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Archivo,Inter,system-ui,sans-serif;letter-spacing:-.015em;margin:0}
h1{font-size:clamp(28px,4vw,40px);line-height:1.05;font-weight:700;text-wrap:balance}
h2{font-size:21px;font-weight:600;line-height:1.2}
h3{font-size:17px;font-weight:600}
button,select{font:inherit;color:inherit}
a{color:var(--sky)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mute{color:var(--mute)}.faint{color:var(--faint)}.sm{font-size:13.5px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:Archivo,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:auto}
.brand svg{width:26px;height:26px;flex:none}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;font-size:15px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-radius:8px;padding:9px 13px;color:var(--mute);cursor:pointer;min-height:40px;font-weight:500}
.tab[aria-current=page]{background:var(--panel2);color:var(--ink)}
.tab:focus-visible,.row:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
main{padding-block:28px 60px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13.5px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sky);flex:none}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 20px}
.fig1{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fig1 b{display:block;font-family:Archivo,sans-serif;font-size:28px;line-height:1.1;font-weight:700}
.fig1 span{font-size:13.5px;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
.stackv{display:grid;gap:16px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{background:none;border:0;border-radius:7px;padding:6px 11px;color:var(--mute);cursor:pointer;min-height:34px}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--ink)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
/* board rows */
.board{display:grid}
.row{display:grid;grid-template-columns:34px minmax(0,1.5fr) minmax(0,1.35fr) 84px minmax(0,1.5fr) 150px 96px minmax(0,1.6fr);gap:10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.row:hover{background:var(--panel2)}
.row.hd{cursor:default;color:var(--faint);font-size:12.5px;border-top:0;padding-block:4px}
.row.hd:hover{background:none}
.rk{font-family:Archivo,sans-serif;font-weight:700;color:var(--mute);text-align:right}
.hn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:5px;background:var(--chip);border:1px solid var(--line);font-size:12.5px;font-weight:600;margin-right:7px;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r{text-align:right}
.meter{position:relative;height:12px;background:var(--bg);border-radius:6px;border:1px solid var(--line)}
.meter i{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--slate)}
.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.8;text-decoration:none}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.p-strong{background:color-mix(in srgb,var(--turf) 20%,transparent);color:var(--turf);border-color:color-mix(in srgb,var(--turf) 45%,transparent)}
.p-lead{background:color-mix(in srgb,var(--sky) 16%,transparent);color:var(--sky);border-color:color-mix(in srgb,var(--sky) 40%,transparent)}
.p-none{background:var(--chip);color:var(--slate);border-color:var(--line)}
.p-ins{background:repeating-linear-gradient(135deg,var(--chip) 0 5px,transparent 5px 9px);color:var(--mute);border-color:var(--line)}
.p-cont{color:var(--mute);border-color:var(--line)}
.p-out{color:var(--faint)}
.ev{letter-spacing:1px;font-size:11px;white-space:nowrap}
.ev i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--turf);margin-right:2px}
.ev i.o{background:transparent;border:1px solid var(--faint)}
/* day timeline */
.tl{position:relative}
.lane{display:grid;grid-template-columns:86px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:10px}
.track{position:relative;height:40px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent 0 0)}
.chip{position:absolute;top:6px;transform:translateX(-50%);height:28px;min-width:30px;padding:0 6px;border-radius:7px;display:grid;place-items:center;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--mute)}
.chip.c-strong{background:var(--turf);color:#06140d;border-color:var(--turf)}
.chip.c-lead{background:color-mix(in srgb,var(--sky) 30%,var(--chip));color:var(--ink);border-color:var(--sky)}
.chip.c-ins{background:repeating-linear-gradient(135deg,var(--chip) 0 4px,var(--bg) 4px 8px)}
.ticks{position:relative;height:18px;margin-left:94px;font-size:12px;color:var(--faint)}
.ticks span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
/* meetings */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.mchip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;min-height:42px;text-align:left}
.mchip[aria-pressed=true]{border-color:var(--sky);background:var(--panel2)}
.rtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.rtab{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;min-height:44px;text-align:left;line-height:1.2}
.rtab[aria-pressed=true]{background:var(--panel2);border-color:var(--sky)}
.rtab small{display:block;color:var(--mute);font-size:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;font-size:14px}
.kv div span{display:block;color:var(--faint);font-size:12.5px}
.fig{position:relative;height:150px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-weight:500;color:var(--faint);font-size:12.5px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.rn{cursor:pointer}
tr.rn:hover td{background:var(--panel2)}
tr.lead td{background:color-mix(in srgb,var(--sky) 7%,transparent)}
tr.xp td{background:var(--panel2)}
.scroll{overflow-x:auto}
.ex{padding:4px 4px 12px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;font-size:14px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--sky);color:#06121d;border-color:var(--sky);font-weight:600}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;padding:max(14px,env(safe-area-inset-top)) 18px 40px}
.open .scrim{display:block}.open .drawer{transform:none}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;position:sticky;top:-14px;background:var(--bg);padding-block:8px;z-index:2}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.trio div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.trio b{display:block;font-family:Archivo,sans-serif;font-size:26px;line-height:1.15}
.trio small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35}
.wf{display:grid;gap:6px;margin-top:8px}
.wr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.6fr) 58px;gap:10px;align-items:center;font-size:14px}
.wb{position:relative;height:16px}
.wb i{position:absolute;top:2px;bottom:2px;border-radius:3px}
.wb s{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--faint)}
.wr.tot{border-top:1px solid var(--line);padding-top:7px;font-weight:600}
.tag{font-size:11px;font-weight:700;color:var(--sky);border:1px solid color-mix(in srgb,var(--sky) 45%,transparent);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
summary{cursor:pointer;font-weight:600;min-height:28px}
.note{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--mute);font-size:14px}
.warn{border:1px solid #7a5a2e;background:#211a10;color:#f1c98f;border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.info{border:1px solid var(--line);background:var(--panel2);color:var(--mute);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.fresh{margin:0 0 12px}.mo{display:none}tr.strike td{color:var(--faint);text-decoration:line-through}
.wait{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mute)}
footer{border-top:1px solid var(--line);padding-block:20px 40px;color:var(--faint);font-size:13px}
.mv{display:grid;grid-template-columns:minmax(0,1.6fr) 90px 90px minmax(0,1.4fr);gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
@media(max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)!important}}
.hidem2{display:none}
@media(max-width:720px){
 .row{grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"rk hn pl" "rk rc mk" "rk mt mt" "rk why why";row-gap:5px;padding:12px 4px}
 .row.hd{display:none}
 .row .c-rk{grid-area:rk;align-self:start}.row .c-hn{grid-area:hn}.row .c-pl{grid-area:pl}.row .c-rc{grid-area:rc}.row .c-mt{grid-area:mt}
 .row .c-rt,.row .c-ir,.row .c-gp,.row .c-ev{display:none}
 .row .c-mk{grid-area:mk;text-align:right}.row .c-why{grid-area:why}.mo{display:inline!important}
 .trio{grid-template-columns:minmax(0,1fr)}
 .trio div{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px}
 .trio div small:first-child{grid-column:1;grid-row:1;font-size:13.5px;color:var(--ink)}
 .trio b{font-size:24px;grid-column:2;grid-row:1/3;align-self:center}
 .trio div small:last-child{grid-column:1;grid-row:2}
 .wr{grid-template-columns:minmax(0,1fr) 54px;row-gap:2px}.wr .wb{grid-column:1/-1;grid-row:2}
 .lane{grid-template-columns:62px minmax(0,1fr)}.ticks{margin-left:70px}
 .hidem{display:none}.hidem2{display:inline}
 .mv{grid-template-columns:minmax(0,1fr) 70px 70px}.mv .why{grid-column:1/-1;font-size:13px}
 td,th{padding:8px 5px}
 .drawer{padding-inline:14px}
}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
</head>
<body>
<header class="top">
 <div class="wrap">
  <div class="bar">
   <div class="brand"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="16" width="22" height="2.4" rx="1.2" fill="#76b4e9"/><rect x="5" y="6" width="2.4" height="16" rx="1" fill="#e8eef3"/><circle cx="6.2" cy="5.2" r="3.2" fill="#4fc48f"/><rect x="11" y="11" width="2" height="7" rx="1" fill="#97a5b2"/><rect x="16" y="9" width="2" height="9" rx="1" fill="#97a5b2"/><rect x="21" y="12" width="2" height="6" rx="1" fill="#97a5b2"/></svg>Racing Intelligence</div>
   <label class="sm mute" for="dateSel">Race day</label>
   <select id="dateSel" class="sel"></select>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
   <button class="tab" data-v="today">Today</button>
   <button class="tab" data-v="meetings">Meetings</button>
   <button class="tab" data-v="compare">Engine Performance</button>
   <button class="tab" data-v="results">Results &amp; returns</button>
   <button class="tab" data-v="method">How it works</button>
  </nav>
 </div>
</header>
<main class="wrap" id="view"><p class="mute">Loading the saved predictions…</p></main>
<footer class="wrap" id="foot"></footer>
<div id="dw"><div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-label="Horse analysis" tabindex="-1"></aside></div>
<script id="ri-data" type="application/json"></script>
<script>
{
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kg=(x,d=1)=>x==null?'–':(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
const pc=(x,d=1)=>x==null?'–':x.toFixed(d)+'%';
const bris=u=>{try{return new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Brisbane',weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}).format(new Date(u))}catch(e){return u}};
const CLS={'Not rated':'p-ins','Strong selection':'p-strong','Leading contender':'p-lead','No clear selection':'p-none','Insufficient evidence':'p-ins','Contender':'p-cont','Outsider':'p-out'};
const CHIP={'Strong selection':'c-strong','Leading contender':'c-lead','No clear selection':'','Insufficient evidence':'c-ins'};
const COLOR={'Strong selection':'var(--turf)','Leading contender':'var(--sky)'};
let D=null,IDX=null,view='today',mSel=null,rSel=1,lbN=10,open=null;
const $=id=>document.getElementById(id);
let adv=false;
const RM=()=>D.meetings.filter(m=>m.rated);
const hm=u=>{try{return new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Brisbane',hour:'numeric',minute:'2-digit'}).format(new Date(u))}catch(e){return u}};
const price=mk=>{if(!mk)return '<span class="faint" title="No TAB price matched to this runner">–</span>';if(mk.note&&!mk.fixed_win&&!mk.exchange_back&&!mk.exchange_ltp)return '<span class="faint sm" title="Checked '+esc(bris(mk.captured_utc))+'">'+esc(mk.note)+'</span>';const w=mk.fixed_win,b=mk.exchange_back||mk.exchange_ltp;let o='';if(w)o+='<span class="num">$'+(+w.price).toFixed(2)+'</span>'+(mk.first_win&&mk.first_win.price!==w.price?' <span class="sub num" title="First TAB price we recorded, '+esc(hm(mk.first_win.captured_utc))+'">was $'+(+mk.first_win.price).toFixed(2)+'</span>':'')+(mk.fixed_place?' <span class="sub num">place $'+(+mk.fixed_place.price).toFixed(2)+'</span>':'')+'<div class="sub">'+esc(w.source)+' fixed · '+esc(hm(w.captured_utc))+'</div>';if(b)o+='<div><span class="num">'+(+b.price).toFixed(2)+'</span> <span class="sub">'+esc(b.source)+' exchange (not TAB) · '+esc(bris(b.captured_utc))+'</span></div>';return o||'<span class="faint">–</span>'};
const reasons=h=>(h.reasons&&h.reasons.length?esc(h.reasons.join(' · ')):'<span class="faint">No single factor stands out</span>');
const meeting=id=>D.meetings.find(m=>m.id===id);
const race=(m,no)=>m.races.find(r=>r.no===no);
const runnerOf=(mname,rno,n)=>{const m=D.meetings.find(x=>x.name===mname||x.id===mname);const r=race(m,rno);return {m,r,h:r.runners.find(x=>x.n===n)}};
const evDots=(s,mx)=>'<span class="ev" title="Evidence '+s+' of '+mx+'">'+Array.from({length:mx},(_,i)=>'<i class="'+(i<s?'':'o')+'"></i>').join('')+'</span>';
const pill=c=>'<span class="pill '+(CLS[c]||'p-cont')+'">'+esc(c)+'</span>';
const meter=(v,lo,hi,col,mx=60)=>'<div class="meter" title="'+pc(v)+' (80% band '+pc(lo,0)+'–'+pc(hi,0)+')"><i style="left:'+Math.min(98,lo/mx*100)+'%;width:'+Math.min(100-Math.min(98,lo/mx*100),Math.max(1.5,(hi-lo)/mx*100))+'%;background:'+(col||'var(--slate)')+';opacity:.8"></i><u style="left:calc('+Math.min(99,v/mx*100)+'% - 1px)"></u></div>';
async function load(){
 const el=$('ri-data');
 if(el&&el.textContent.trim().length>2){const d=JSON.parse(el.textContent);IDX={days:[{date:d.date,file:null}]};return d}
 IDX=await fetch('data/index.json').then(r=>r.json());
 return fetch('data/'+IDX.days[0].file).then(r=>r.json());
}
function setDates(){$('dateSel').innerHTML=IDX.days.map(d=>'<option value="'+esc(d.date)+'">'+esc(new Date(d.date+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'}))+'</option>').join('')}
function stats(){const rated=RM().flatMap(m=>m.races),all=D.meetings.flatMap(m=>m.races);const lab=l=>rated.filter(r=>r.label===l).length;return {races:all,rated,n:all.reduce((a,r)=>a+r.runners.filter(x=>(x.status||'runner')==='runner').length,0),strong:lab('Strong selection'),lead:lab('Leading contender'),none:lab('No clear selection'),ins:lab('Insufficient evidence'),fo:all.length-rated.length}}
function freshBox(){
 const F=D.freshness||{};const now=Date.now();const day0=new Date(D.date+'T00:00:00+10:00').getTime();
 const left=D.meetings.flatMap(m=>m.races).filter(r=>r.time_brisbane_min!=null&&day0+r.time_brisbane_min*60000>now).length;
 const mins=F.latest_update_utc?Math.round((now-new Date(F.latest_update_utc))/60000):null;const stale=left>0&&mins!=null&&mins>(F.stale_after_min||90);
 const age=mins==null?'unknown':mins<60?mins+' min ago':Math.floor(mins/60)+' h '+(mins%60)+' min ago';
 return (stale?'<div class="warn"><b>Data may be stale.</b> The last successful update was '+esc(age)+' ('+esc(bris(F.latest_update_utc))+') and '+left+' race'+(left>1?'s are':' is')+' still to run. Scratchings or rider changes since then are not reflected.</div>':'')+
  '<div class="fresh sm mute">Latest successful update <b>'+esc(F.latest_update_utc?bris(F.latest_update_utc):'–')+'</b> ('+esc(age)+') · page built '+esc(bris(D.exported_utc))+' · Brisbane time</div>';
}

 const sum=h.groups.reduce((a,g)=>a+g.kg,0);let cum=0;const steps=h.groups.map(g=>{const a=cum;cum+=g.kg;return {...g,a,b:cum}});
 const lo=Math.min(0,...steps.map(s=>Math.min(s.a,s.b))),hi=Math.max(0,...steps.map(s=>Math.max(s.a,s.b)));const sp=(hi-lo)||1,X=v=>((v-lo)/sp*100);
 const wf=steps.map(s=>'<div class="wr"><div>'+esc(s.label)+(s.new_in_v2?'<span class="tag" title="Added in Engine v2">v2</span>':'')+'</div><div class="wb"><s style="left:'+X(0)+'%"></s><i style="left:'+X(Math.min(s.a,s.b))+'%;width:'+Math.max(.6,Math.abs(s.b-s.a)/sp*100)+'%;background:'+(s.kg>=0?'var(--turf)':'var(--coral)')+'"></i></div><div class="r num">'+kg(s.kg,2)+'</div></div>').join('')+
  '<div class="wr tot"><div>Final race rating</div><div class="wb"><s style="left:'+X(0)+'%"></s><i style="left:'+X(Math.min(0,sum))+'%;width:'+Math.max(.6,Math.abs(sum)/sp*100)+'%;background:var(--sky)"></i></div><div class="r num">'+kg(h.rating,2)+'</div></div>';
 const a=h.ability,rec=h.records,p=h.people;const avgA=r.runners.reduce((t,x)=>t+x.ability.rating_kg,0)/r.runners.length;const aRel=a.rating_kg-avgA;const rc=(lbl,o)=>'<div><span class="faint sm">'+lbl+'</span><div class="num">'+(o.runs?kg(o.kg,1)+' kg over '+o.runs+' run'+(o.runs>1?'s':''):'No earlier runs')+'</div></div>';
 const v1=h.v1;const mv=v1.rank===h.rank?'Same rank in this engine\'s first layer':'This engine\'s first layer had it '+ordinal(v1.rank).replace(' of field','')+' ('+pc(v1.chance)+')';
 $('drawer').innerHTML='<div class="dh"><div><div class="sub">'+esc(m.name)+' · Race '+r.no+' · '+r.distance_m+'m'+(m.conditions.going?' · '+esc(m.conditions.going):'')+' · <span class="num">'+esc(r.time)+' '+esc(r.tz)+'</span></div><h2 style="margin-top:4px"><span class="sc">'+h.n+'</span>'+esc(h.horse)+'</h2><div class="sub">'+esc(h.jockey||'jockey tba')+' · '+esc(h.trainer||'')+' · barrier '+(h.barrier??'–')+' · '+(h.weight??'–')+'kg'+(h.last10?' · form '+esc(h.last10):'')+'</div></div><button class="btn" id="close" aria-label="Close">Close</button></div>'+
 '<div style="margin-top:8px">'+pill(h.class)+' <span class="sub">'+(h.rank===1?'Top-rated in this race':ordinal(h.rank))+'</span></div>'+
 '<div class="trio"><div><small>Model win chance</small><b class="num">'+pc(h.cal)+'</b><small>calibrated · 80% band '+h.cal_lo.toFixed(1)+'–'+pc(h.cal_hi)+'</small></div><div><small>Selection strength</small><b style="font-size:19px">'+esc(h.class)+'</b><small>'+(h.rank===1?'top-rated in this race':ordinal(h.rank))+' · evidence '+h.evidence.score+' of '+h.evidence.max+'</small></div><div><small>Market price</small><div style="margin:4px 0">'+price(h.market)+'</div><small>display only; never used by the model</small></div></div>'+'<details><summary>Advanced: relative-performance scale</summary><div class="mini" style="margin-top:8px"><div><span class="faint sm">Final race rating</span><div class="num">'+kg(h.rating)+'</div></div><div><span class="faint sm">Underlying ability vs this field</span><div class="num">'+(a.rated_runs?kg(aRel):'Debut')+'</div></div><div><span class="faint sm">Raw model chance</span><div class="num">'+pc(h.chance)+'</div></div></div><p class="sm faint" style="margin:8px 0 0">A statistical relative-performance scale in kg-equivalent units, so different factors share one currency. It is not the weight carried and not a beaten margin; 0 is this field\'s average runner.'+(a.rated_runs?' Ability from '+a.rated_runs+' rated run'+(a.rated_runs>1?'s':'')+(a.sd_kg!=null?', uncertainty ± '+a.sd_kg.toFixed(1):'')+'.':' No rated runs yet: a starting estimate, not a measurement.')+'</p></details>'+
 '<h3>Why this rating</h3><p class="sm mute" style="margin:4px 0 6px">Each bar is what that family of learned factors adds or removes for this horse in this field. They are on the relative-performance scale (see Advanced above) and add up exactly to the final rating.</p><div class="wf">'+wf+'</div>'+

 '<h3 style="margin-top:18px">Jockey and trainer</h3><div class="mini" style="margin-top:8px"><div><span class="faint sm">Jockey\'s earlier rides vs their ratings</span><div class="num">'+(p.jockey_kg!=null?kg(p.jockey_kg,2)+' kg · '+p.jockey_rides+' rides':'Not named / no history')+'</div></div><div><span class="faint sm">Trainer\'s earlier runners vs their ratings</span><div class="num">'+(p.trainer_kg!=null?kg(p.trainer_kg,2)+' kg · '+p.trainer_runners+' runners':'No history')+'</div></div><div><span class="faint sm">This jockey-trainer pair</span><div class="num">'+(p.combo_kg!=null?kg(p.combo_kg,2)+' kg':'–')+'</div></div>'+(h.age!=null?'<div><span class="faint sm">Age · sex</span><div>'+h.age+'yo'+(h.female?' · mare/filly':'')+'</div></div>':'')+'</div>'+
 '<h3 style="margin-top:18px">Movement</h3><div class="mini" style="margin-top:8px"><div><span class="faint sm">Ability rating after its last run</span><div class="num">'+(a.change_after_last_run_kg!=null?kg(a.change_after_last_run_kg,1)+' kg':'–')+(a.last_run?' · last run '+esc(new Date(a.last_run+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'})):'')+'</div></div><div><span class="faint sm">Versus this engine\'s first layer (v1-style score on this engine\'s rating; not the original Engine v1)</span><div>'+esc(mv)+'</div></div><div><span class="faint sm">Earlier snapshots</span><div>'+(m.snapshots.length>1?m.snapshots.length+' saved':'Only one so far (night-before fields)')+'</div></div></div>'+
 trkBox(h,m)+'<h3 style="margin-top:18px">Evidence</h3><div style="margin-top:6px">'+evDots(h.evidence.score,h.evidence.max)+' <span class="sm mute">'+h.evidence.score+' of '+h.evidence.max+' evidence checks</span></div>'+(h.evidence.gaps.length?'<ul class="sm" style="margin:8px 0 0;padding-left:18px">'+h.evidence.gaps.map(g=>'<li>'+esc(g)+'</li>').join('')+'</ul>':'<p class="sm mute">No important gaps.</p>')+
 '<details><summary>Advanced: individual model terms</summary><p class="sm mute">This engine = its first-layer score (a v1-style score fitted on this engine\'s rating, kept whole and shown above by family) plus learned terms, each in kg-equivalent. Terms are race-relative and penalised; correlated terms share credit, so one term\'s size is not its importance on its own. Engine v2 terms for this runner:</p><div class="wf">'+(h.terms.length?h.terms.map(t=>'<div class="wr" style="grid-template-columns:minmax(0,1fr) 60px"><div class="sm">'+esc(t.term)+'</div><div class="r num sm" style="color:'+(t.kg>=0?'var(--turf)':'var(--coral)')+'">'+kg(t.kg,2)+'</div></div>').join(''):'<p class="sm">None above 0.005.</p>')+'</div><p class="sm faint">Scale: '+esc(D.engine.scale)+'</p></details>';
 document.body.classList.add('open');$('drawer').focus();
}

function vCompareLegacy(){
 const all=RM().flatMap(m=>m.races.flatMap(r=>r.runners.map(h=>({m,r,h}))));const changed=RM().flatMap(m=>m.races.map(r=>({m,r}))).filter(x=>x.r.v1_top!==x.r.runners[0].horse);
 const mv=all.map(x=>({...x,d:x.h.chance-x.h.v1.chance})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,12);
 const why=h=>h.groups.filter(g=>g.new_in_v2&&Math.abs(g.kg)>0.1).sort((a,b)=>Math.abs(b.kg)-Math.abs(a.kg)).map(g=>esc(g.label)+' '+kg(g.kg)).join(', ')||'Small changes across families';
 const V=D.validation;const chain=(rows)=>'<div class="scroll"><table><thead><tr><th>Version</th><th class="r">Fit</th><th class="r">Top pick won</th><th class="r">Winner in top 3</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.version)+'</td><td class="r num">'+pc(r.fit,2)+'</td><td class="r num">'+pc(r.top_pick)+'</td><td class="r num">'+pc(r.top3)+'</td></tr>').join('')+'</tbody></table></div>';
 const roll=(rows,lbl)=>'<div class="scroll"><table><thead><tr><th>'+lbl+': test year</th><th class="r">v1 top pick</th><th class="r">v2 top pick</th><th class="r">Fit gain per race (95%)</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r.test_year+'</td><td class="r num">'+pc(r['v1 top_pick_%'])+'</td><td class="r num">'+pc(r['v2 top_pick_%'])+'</td><td class="r num">+'+r.gain_lp.toFixed(3)+' ('+r.gain_lp_lo.toFixed(3)+'–'+r.gain_lp_hi.toFixed(3)+')</td></tr>').join('')+'</tbody></table></div>';
 return '<div class="warn" style="background:var(--panel2);border-color:var(--line);color:var(--mute)"><b style="color:var(--ink)">Archived view.</b> This day was exported before the Engine Performance view existed (27 Nov 2026), so it shows the original Engine v1 vs v2 comparison.</div><div class="head"><div><h1>Engine v1 vs v2</h1><div class="mute" style="margin-top:6px">Engine v2 changed the top pick in '+changed.length+' of '+RM().reduce((a,m)=>a+m.races.length,0)+' races today. Both versions were saved before racing.</div></div></div>'+
 '<div class="grid2"><section class="panel"><h2>Biggest movers today</h2><p class="sm mute" style="margin:6px 0 4px">Change in model chance from v1 to v2, and the v2 factor families that moved it.</p><div class="mv hd" style="cursor:default;color:var(--faint);font-size:12.5px"><div>Horse</div><div class="r">v1</div><div class="r">v2</div><div class="why">Why it moved</div></div>'+mv.map(x=>'<div class="mv" data-h="'+esc(x.m.name)+'|'+x.r.no+'|'+x.h.n+'"><div><span class="sc">'+x.h.n+'</span><b>'+esc(x.h.horse)+'</b><div class="sub">'+esc(x.m.name)+' R'+x.r.no+'</div></div><div class="r num">'+pc(x.h.v1.chance)+'<div class="sub">#'+x.h.v1.rank+'</div></div><div class="r num" style="color:'+(x.d>0?'var(--turf)':'var(--coral)')+'">'+pc(x.h.chance)+'<div class="sub">#'+x.h.rank+'</div></div><div class="why sm mute">'+why(x.h)+'</div></div>').join('')+'</section>'+
 '<div class="stackv"><section class="panel"><h2>Top pick changes</h2><div class="scroll" style="margin-top:8px"><table><thead><tr><th>Race</th><th>v1</th><th>v2</th></tr></thead><tbody>'+RM().flatMap(m=>m.races.map(r=>'<tr><td class="num">'+esc(m.name)+' R'+r.no+'</td><td>'+esc(r.v1_top)+'</td><td>'+(r.v1_top!==r.runners[0].horse?'<b>'+esc(r.runners[0].horse)+'</b>':'<span class="mute">same</span>')+'</td></tr>')).join('')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Prospective record</h2><p class="mute sm" style="margin-top:8px">'+esc(D.results.message)+' Two meetings will be far too few to judge either version.</p></section></div></div>'+
 '<section class="panel" style="margin-top:16px"><h2>Historical backtest (research results, not live performance)</h2><p class="sm mute" style="margin:6px 0 12px">Identical races, '+esc(V.period)+'. Fit = how much better than random the winner\'s chance was.</p><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))"><div><h3 style="margin-bottom:6px">Queensland ('+V.races.qld.toLocaleString()+' races)</h3>'+chain(V.qld_chain)+'</div><div><h3 style="margin-bottom:6px">NSW, Vic, ACT ('+V.races.nat.toLocaleString()+' races)</h3>'+chain(V.nat_chain)+'</div><div>'+roll(V.rolling.qld,'Qld')+'</div><div>'+roll(V.rolling.nat,'NSW/Vic')+'</div></div><p class="note" style="margin-top:14px">Rolling-origin rows re-fit everything using only earlier years, then test the next year. Gains are not additive: the NSW/Vic families added one at a time sum to more than they add together, because they overlap; the engine fits them jointly. '+V.caveats.map(esc).join(' ')+'</p></section>';
}
function vResults(){
 return '<div class="head"><div><h1>Results and review</h1><div class="mute" style="margin-top:6px">Saved predictions are compared with what happened. Original predictions are never replaced.</div></div></div><div class="wait"><h2 style="color:var(--ink);margin-bottom:8px">Waiting for results</h2><p style="max-width:560px;margin:0 auto">'+esc(D.results.message)+'</p><p class="sm faint" style="max-width:560px;margin:12px auto 0">When they arrive this page will show each race\'s finishing order against the saved ratings, how the top-rated runners went, production against the previous engine and shadow candidates on probability and ranking measures, and the biggest surprises as research questions. One loss is not evidence the model was wrong; patterns over many races are.</p></div>'+
 ''+roiBox()+'<section class="panel" style="margin-top:16px"><h2>Saved prediction fingerprints</h2><div class="scroll" style="margin-top:8px"><table><thead><tr><th>Meeting</th><th>Fields captured</th><th>Scored</th><th>Engine</th><th>Settings fingerprint</th><th class="r">kg scale</th><th>Fallback</th><th>History to</th><th>Prediction file</th><th>Base layer file</th></tr></thead><tbody>'+RM().map(m=>{const s=m.snapshots.find(x=>x.id===m.default_snapshot),g=m.provenance.settings||{};return '<tr><td>'+esc(m.name)+'</td><td class="num">'+esc(bris(s.fields_captured_utc))+'</td><td class="num">'+esc(bris(s.v2_scored_utc))+'</td><td class="sm">'+esc(g.engine||m.provenance.engine_release||'')+'</td><td class="num sm">'+(g.fingerprint?esc(g.fingerprint):'<span class="faint">not recorded</span>')+(g.source&&g.source!=='recorded when scored'?'<div class="sub" style="white-space:normal">'+esc(g.source)+'</div>':'')+'</td><td class="r num sm">'+(g.scale_per_kg??'–')+'</td><td class="sm">'+esc(g.fallback||'–')+'</td><td class="num">'+esc(m.provenance.history_to)+'</td><td class="num sm">'+esc(m.provenance.v2_prediction_sha256)+'</td><td class="num sm">'+esc(m.provenance.v1_prediction_sha256)+'</td></tr>'}).join('')+'</tbody></table></div><p class="sm faint" style="margin:8px 0 0">Settings fingerprint = SHA-256 of the engine settings held in memory when the meeting was scored (from 28 Nov 2026; 27 Nov was verified afterwards by replaying the saved inputs). kg scale = model units per kg for that engine. File columns are SHA-256 prefixes of the write-once prediction files: any later change to a file would change its fingerprint.</p></section>';
}
function roiBox(){const R=D.roi;if(!R)return '';
 return '<section class="panel" style="margin-top:16px"><div class="ph"><h2>Selections and returns</h2><span class="badge">'+R.paper.selections+' selections · '+R.paper.priced+' priced · '+R.paper.settled+' settled</span></div>'+
 '<p class="sm mute" style="margin:4px 0 10px"><b>Paper</b> returns use the recorded quote; <b>realised</b> returns are only bets you placed and record yourself ('+R.realised.bets+' so far). They are never mixed. '+(R.paper.priced?'Quoted price = the last TAB fixed win price collected at or before 5 minutes before the start. Returns are calculated once results are in.':'No price has been collected for these selections yet.')+' Every selection is recorded before racing so nothing is chosen after the fact.</p>'+
 '<div class="scroll"><table><thead><tr><th>Race</th><th>Selection</th><th class="r">Model win chance</th><th class="hidem">Strength</th><th>Quoted price</th><th>Result</th><th class="hidem">Settlement</th></tr></thead><tbody>'+
 R.selections.map(x=>'<tr data-go="'+x.meeting.toLowerCase()+'-r'+x.race+'" style="cursor:pointer"><td class="num">'+esc(x.meeting)+' R'+x.race+'<div class="sub">'+esc(x.time)+' '+esc(x.tz)+'</div></td><td><span class="sc">'+x.n+'</span>'+esc(x.horse)+'<div class="sub">'+esc(x.model_version)+' · rank '+x.rank+'</div></td><td class="r num">'+pc(x.win_chance)+'</td><td class="hidem">'+pill(x.classification)+'</td><td class="sm">'+(x.price?'$'+(+x.price).toFixed(2)+'<div class="sub">'+esc(x.price_source)+' · '+esc(bris(x.price_time_utc))+'</div>':'<span class="faint">none captured</span>')+'</td><td>'+(x.result?esc(x.result):'<span class="faint">–</span>')+'</td><td class="sm hidem">'+esc(x.settlement)+'</td></tr>').join('')+'</tbody></table></div>'+
 (R.paper.settled?'<div class="figs" style="margin-top:14px"><div class="fig1"><b>'+R.paper.settled+'</b><span>settled selections</span></div><div class="fig1"><b>'+R.paper.winners+'</b><span>winners</span></div><div class="fig1"><b>'+(R.paper.return_units>0?'+':'')+R.paper.return_units+'</b><span>paper return (units)</span></div><div class="fig1"><b>'+(R.paper.roi_pct==null?'–':R.paper.roi_pct+'%')+'</b><span>paper ROI</span></div></div>'+(R.groups&&R.groups.length?'<div class="scroll" style="margin-top:10px"><table><thead><tr><th>Group</th><th class="r">Bets</th><th class="r">Win rate</th><th class="r">Avg price</th><th class="r">Return</th><th class="r">ROI</th></tr></thead><tbody>'+R.groups.map(g=>'<tr><td>'+esc(g.group)+': '+esc(g.value)+'</td><td class="r num">'+g.bets+'</td><td class="r num">'+g.win_rate_pct+'%</td><td class="r num">$'+g.avg_price+'</td><td class="r num">'+g.return_units+'</td><td class="r num">'+g.roi_pct+'%</td></tr>').join('')+'</tbody></table></div>':''):'')+'<h3 style="margin-top:16px">Rules</h3><ul class="sm" style="margin:6px 0 0;padding-left:18px">'+R.rules.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
 '<p class="sm faint" style="margin:10px 0 0">When results and prices exist, returns are grouped by date, course, state, model version, selection strength and period, each with win rate, average price, return and sample size.</p></section>';}
function vCompare(){
 const E=D.engine_performance;if(!E||E.error)return vCompareLegacy();
 const sg=v=>v>0?'+':v<0?'−':'';
 const gi=(g,lo,hi,d=4)=>g==null?'–':sg(g)+Math.abs(g).toFixed(d)+(lo!=null&&hi!=null?' <span class="faint">('+sg(lo).replace('+','')+Math.abs(lo).toFixed(d)+' to '+sg(hi).replace('+','')+Math.abs(hi).toFixed(d)+')</span>':'');
 const pts=x=>x==null?'–':sg(x)+Math.abs(x).toFixed(1)+' pts';
 const st=(t,c)=>'<span class="pill '+(c||(/^Ahead/.test(t)?'p-strong':/^Behind/.test(t)?'p-out':/^Too few/.test(t)?'p-ins':'p-none'))+'" style="white-space:normal">'+esc(t)+'</span>';
 const dt=x=>x?esc(new Date(x+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'})):'–';
 const rec=s=>s?'<div class="mini" style="margin-top:6px"><div><span class="faint sm">Races</span><div class="num">'+s.races+' <span class="sub">('+s.days+' day'+(s.days>1?'s':'')+')</span></div></div><div><span class="faint sm">Top pick won</span><div class="num">'+pc(s.top_pick_pct)+'</div></div><div><span class="faint sm">Winner in top 3</span><div class="num">'+pc(s.top3_pct)+'</div></div><div><span class="faint sm">Fit</span><div class="num">'+pc(s.fit,1)+'</div></div></div>':'<p class="sm mute" style="margin:6px 0 0">No settled races yet. Each race day is judged the next morning.</p>';
 const vsp=v=>{if(!v)return '<p class="sm mute" style="margin:0">No comparison yet: it needs settled races where both engines were saved before the start.</p>';
  const flip=t=>t.replace('Ahead of production','Previous engine ahead').replace('Behind production','Production ahead');
  const fc=/^Behind/.test(v.status)?'p-strong':/^Ahead/.test(v.status)?'p-out':null;
  return '<div class="mini"><div><span class="faint sm">Production gain per race (95%)</span><div class="num">'+gi(-v.gain_per_race,v.hi==null?null:-v.hi,v.lo==null?null:-v.lo)+'</div></div><div><span class="faint sm">Top pick</span><div class="num">'+pts(-v.top_pick_pts)+'</div></div><div><span class="faint sm">Races compared</span><div class="num">'+v.races+'</div></div></div><div style="margin-top:8px">'+st(flip(v.status),fc)+'</div>'};
 const fam=f=>'<section class="panel"><div class="ph"><h2>'+esc(f.label)+'</h2><span class="badge">live from '+dt(f.production_from)+'</span></div>'+
  '<div style="font-family:Archivo,sans-serif;font-size:24px;font-weight:700;margin:6px 0 2px">'+esc(f.production)+'</div><p class="sm mute" style="margin:0 0 10px">'+esc(f.change)+'</p>'+
  '<h3>Since release (prospective)</h3>'+rec(f.since_release)+
  '<h3 style="margin-top:14px">Versus '+esc(f.predecessor)+', same races</h3><p class="sm faint" style="margin:4px 0 6px">'+esc(f.predecessor_status)+'.</p>'+vsp(f.vs_predecessor)+(f.comparison_basis?'<p class="sm faint" style="margin:8px 0 0">'+esc(f.comparison_basis)+'</p>':'')+'</section>';
 const cand='<div class="scroll"><table><thead><tr><th>Candidate</th><th>States</th><th>Status</th><th>Prospective vs production (same races)</th><th>Research evidence</th></tr></thead><tbody>'+E.candidates.map(c=>'<tr><td><b>'+esc(c.name)+'</b><div class="sub" style="white-space:normal">'+esc(c.what)+'</div></td><td class="sm">'+(c.family==='QLD'?'Qld':'NSW, Vic, ACT, SA, WA, Tas')+'</td><td class="sm">'+esc(c.status)+'</td><td class="sm">'+(c.vs_production?gi(c.vs_production.gain_per_race,c.vs_production.lo,c.vs_production.hi)+' per race · top pick '+pts(c.vs_production.top_pick_pts)+'<div style="margin-top:4px">'+st(c.vs_production.status)+'</div>':'<span class="faint">not scoring</span>')+'</td><td class="sm mute">'+esc(c.evidence)+'</td></tr>').join('')+'</tbody></table></div>';
 const byEng='<div class="scroll"><table><thead><tr><th>States</th><th>Engine</th><th>Days</th><th class="r">Races</th><th class="r">Top pick won</th><th class="r">Winner in top 3</th><th class="r">Fit</th></tr></thead><tbody>'+E.families.flatMap(f=>f.production_by_engine.map(r=>'<tr><td class="sm">'+esc(f.label)+'</td><td>'+esc(r.engine)+'</td><td class="sm num">'+dt(r.from)+(r.to!==r.from?' – '+dt(r.to):'')+'</td><td class="r num">'+r.races+'</td><td class="r num">'+pc(r.top_pick_pct)+'</td><td class="r num">'+pc(r.top3_pct)+'</td><td class="r num">'+pc(r.fit,1)+'</td></tr>')).join('')+'</tbody></table></div>';
 const vt=rows=>'<div class="scroll"><table><thead><tr><th>Version</th><th class="r">Fit</th><th class="r">Top pick won</th><th class="r">Winner in top 3</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.version)+'</td><td class="r num">'+pc(r.fit,2)+'</td><td class="r num">'+pc(r.top_pick)+'</td><td class="r num">'+pc(r.top3)+'</td></tr>').join('')+'</tbody></table></div>';
 const chain=f=>'<h3 style="margin:16px 0 6px">'+esc(f.label)+'</h3><div class="scroll"><table><thead><tr><th>Version</th><th>Live</th><th>What changed</th><th class="r">Gain per race vs previous (95%)</th><th class="r">2024 check</th><th>Evidence status</th></tr></thead><tbody>'+f.chain.map(c=>'<tr><td><b>'+esc(c.version)+'</b>'+(c.version===f.production?' <span class="tag">live</span>':'')+'</td><td class="sm num">'+dt(c.live)+'</td><td class="sm" style="min-width:220px">'+esc(c.what)+'<div class="sub" style="white-space:normal">'+esc(c.test)+'</div></td><td class="r num sm">'+(c.gain!=null?gi(c.gain,c.lo,c.hi):'baseline')+'</td><td class="r num sm">'+(c.gain_2024!=null?gi(c.gain_2024,c.lo_2024,c.hi_2024):'–')+'</td><td class="sm mute">'+esc(c.status)+'</td></tr>').join('')+'</tbody></table></div>'+
  (f.identical_races?'<p class="sm" style="margin:12px 0 4px"><b>'+esc(f.identical_races.label)+'</b></p>'+vt(f.identical_races.rows)+'<p class="sm faint" style="margin:6px 0 0">'+esc(f.identical_races.caveat)+'</p>':'')+
  (f.cumulative_note?'<p class="sm faint" style="margin:8px 0 0">'+esc(f.cumulative_note)+'</p>':'');
 const V=D.validation;
 const arch=V?'<details style="margin-top:16px"><summary>Archive: Engine v1 vs v2 release backtest (24 Nov 2026)</summary><p class="sm mute" style="margin:8px 0">Kept for the record. Identical races, '+esc(V.period)+'. These rows are the original Engine v1 and Engine v2.0 of 24 Nov; the first layer inside today\'s engines is refitted on their own ratings and is not the original Engine v1.</p><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))"><div><h3 style="margin-bottom:6px">Queensland ('+V.races.qld.toLocaleString()+' races)</h3>'+vt(V.qld_chain)+'</div><div><h3 style="margin-bottom:6px">NSW, Vic, ACT ('+V.races.nat.toLocaleString()+' races)</h3>'+vt(V.nat_chain)+'</div></div><p class="note" style="margin-top:10px">'+V.caveats.map(esc).join(' ')+'</p></details>':'';
 return '<div class="head"><div><h1>Engine Performance</h1><div class="mute" style="margin-top:6px">Production engines, their predecessors and shadow candidates, judged on races run after release (results to '+dt(E.ledger_races_to)+'). Research figures on past races are kept separate below.</div></div></div>'+
 '<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))">'+E.families.map(fam).join('')+'</div>'+
 '<section class="panel" style="margin-top:16px"><h2>Shadow candidates</h2><p class="sm mute" style="margin:6px 0 10px">Scored before racing like production and never shown as tips. Candidates that are built but waiting, or approved but not built, are listed too.</p>'+cand+'</section>'+
 '<section class="panel" style="margin-top:16px"><h2>Production record by engine (prospective)</h2><p class="sm mute" style="margin:6px 0 10px">Each row covers only the days that engine was live, so the rows are different races and should not be compared with each other.</p>'+byEng+'</section>'+
 '<section class="panel" style="margin-top:16px"><h2>Historical research benchmarks</h2><p class="sm mute" style="margin:6px 0 0">Release evidence on past races, not live performance. Each step is measured against the version before it.</p>'+E.families.map(chain).join('')+arch+'</section>'+
 (E.checkpoints?'<section class="panel" style="margin-top:16px"><h2>Prospective checkpoints</h2><p class="sm" style="margin:6px 0"><span class="pill p-ins">'+esc(E.checkpoints.status)+'</span></p><p class="sm" style="margin:6px 0">'+esc(E.checkpoints.rule)+'</p><p class="sm faint" style="margin:0">'+esc(E.checkpoints.why)+'</p></section>':'')+
 '<p class="note" style="margin-top:14px">'+E.notes.map(esc).join(' ')+'</p>';
}
function vMethod(){
 const cal=k=>{const c=D.engine.calibration[k];return '<div>'+c.deciles.map(d=>'<div class="wr" style="grid-template-columns:70px minmax(0,1fr) 92px"><div class="sm num">'+pc(d.model_chance*100)+'</div><div class="wb"><i style="left:0;width:'+(d.actual/0.35*100)+'%;background:var(--sky);opacity:.75"></i><s style="left:'+(d.model_chance/0.35*100)+'%;width:2px;background:var(--ink)"></s></div><div class="sm num r">won '+pc(d.actual*100)+'</div></div>').join('')+'</div>'};
 const items=[['The historical database','Every runner in Queensland tracked races (with official sectionals) and NSW, Victorian and ACT results from October 2022, linked by horse, with jump-outs and trials excluded. Prices are never used.'],
  ['Current ability','A dynamic, opposition-aware rating in kg: after each run it moves by how far the horse beat or missed the ratings of the horses it actually met, allowing for margins and weight. It only ever uses earlier races.'],
  ['Opposition strength','A second beating a strong field can rate higher than a win in a weak one, because the rating learns from who was behind and in front.'],
  ['Form and figures','Recent finishing positions and margins, career starts, best and recent figures, the quality of fields met, and in Queensland closing sectionals and race shape.'],
  ['Jockey and trainer','How far each jockey\'s and trainer\'s earlier runners beat their own ratings, shrunk when there is little history, plus the pairing and a jockey change. Added in Engine v2; the largest new signal, and checked for leakage by rebuilding it from rides at least 28 days old.'],
  ['Course, going and distance suitability','Each horse\'s own record above or below its rating at this course, on this going band and at this distance band. General course biases (barrier, pace, going) were tested repeatedly and not supported, so none is applied.'],
  ['Other supported effects','In NSW/Vic: age and sex, size of distance change, head-to-head with today\'s rivals, and 65 interactions chosen on earlier data only (for example, jockey and trainer edges count for more in Victoria and on wet tracks).'],
  ['One rating','Every factor\'s weight is learned from data in a within-race model; correlated factors are fitted together so they share credit. The final score is shown in kg-equivalent and breaks down exactly into its parts.'],
  ['Selection strength','The model\'s chance is calibrated against 2025–26 races it was not fitted on, by field size, so runners in different races can be compared. Labels compare a race\'s top pick with that state group\'s history.'],
  ['Where data is thin','No sectionals or barrier history outside Queensland; no age for Queensland history; no Victorian fields collector yet; debutants and horses new to our data are flagged rather than guessed.']];
 return '<div class="head"><div><h1>How the ratings work</h1><div class="mute" style="margin-top:6px">'+esc(D.engine.operational)+', released '+esc(bris(D.engine.released_utc))+'. The engine is evolving: each version must beat the last on identical races before it is used.</div></div></div>'+
 '<div class="grid2"><section class="panel"><ol style="margin:0;padding-left:20px;display:grid;gap:12px">'+items.map(i=>'<li><b>'+esc(i[0])+'.</b> <span class="mute">'+esc(i[1])+'</span></li>').join('')+'</ol></section>'+
 '<div class="stackv"><section class="panel"><h3>Is the calibrated chance honest?</h3><p class="sm mute" style="margin:6px 0 10px">2025–26 NSW/Vic runners in ten groups by model chance: bar = how often they actually won, tick = the model\'s raw chance. Calibration corrects the over-confidence at the top.</p>'+cal('NSW_VIC_ACT')+'</section>'+
 '<details><summary>Advanced: versions and evidence</summary><p class="sm">The original Engine v1 (24 Nov) is a frozen historical benchmark. Every later engine keeps a v1-style first layer refitted on its own rating, so that layer is not the original Engine v1; the previous production engines are scored daily as shadows (see Engine Performance). Engine v2 keeps its first-layer score whole and adds learned terms (Qld: horse records, jockey and trainer; NSW/Vic: jockey and trainer, age and sex, form changes and head-to-head, interactions), estimated jointly with a penalty chosen on earlier data, then re-fitted on all races to 23 Nov 2026.</p><p class="sm">'+esc(D.engine.scale)+'</p><p class="sm">Top-pick tiers in 2025–26: '+Object.entries(D.engine.calibration).map(([k,c])=>esc(k==='QLD'?'Qld':'NSW/Vic')+': '+c.top_pick_tiers.map(t=>esc(t.tier)+' '+pc(t.top_pick_won*100)+' won ('+t.races+' races)').join(', ')).join('; ')+'.</p><p class="sm">'+D.validation.caveats.map(esc).join(' ')+'</p></details></div></div>';
}
function render(){
 document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.v===view?'page':'false'));
 $('view').innerHTML=view==='today'?vToday():view==='meetings'?vMeetings():view==='compare'?vCompare():view==='results'?vResults():vMethod();
 drawRail();
}
function route(){
 let h=location.hash.slice(1);try{h=decodeURIComponent(h)}catch(e){}let m;   // decoded: meeting ids can contain spaces (Sunshine Coast, Mount Gambier)
 if((m=h.match(/^(.+?)-r(\d+)(?:-n(\d+))?$/))&&meeting(m[1])){view='meetings';mSel=m[1];rSel=+m[2];render();if(m[3]){const mm=meeting(m[1]);drawer(mm.name+'|'+m[2]+'|'+m[3])}else document.body.classList.remove('open');return}
 view=['today','meetings','compare','results','method'].includes(h)?h:'today';document.body.classList.remove('open');render();
}
const ro=new ResizeObserver(()=>drawRail());ro.observe(document.body);
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-v],[data-n],[data-m],[data-r],[data-x],[data-h],[data-go],[data-adv],#close,#scrim');if(!t)return;
 if(t.dataset.adv){adv=!adv;render();return}
 if(t.id==='close'||t.id==='scrim'){closeDrawer();return}
 if(t.dataset.v){location.hash=t.dataset.v;return}
 if(t.dataset.n){lbN=t.dataset.n==='all'?'all':+t.dataset.n;render();return}
 if(t.dataset.go){location.hash=t.dataset.go;return}
 if(t.dataset.m&&!t.dataset.r&&t.classList.contains('mchip')){location.hash=t.dataset.m+'-r1';return}
 if(t.dataset.r&&t.classList.contains('rtab')){open=null;location.hash=mSel+'-r'+t.dataset.r;return}
 if(t.dataset.x){open=open===t.dataset.x?null:t.dataset.x;render();return}
 if(t.dataset.h){const [mn,r,n]=t.dataset.h.split('|');const mm=D.meetings.find(x=>x.name===mn);drawer(t.dataset.h);if(view==='meetings')history.replaceState(null,'','#'+mm.id+'-r'+r+'-n'+n);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='Enter'&&e.target.classList.contains('row'))e.target.click()});
window.addEventListener('hashchange',route);
load().then(d=>{D=d;setDates();mSel=D.meetings[0].id;
 $('foot').innerHTML='<p><b>'+esc(D.snapshot_note)+'</b> Exported '+esc(bris(D.exported_utc))+' (Brisbane). Data contract '+esc(D.contract.name)+' v'+esc(D.contract.version)+'. The model uses performance data only; prices are a separate, labelled display layer.</p><p>Operations at export: '+D.operations.map(o=>esc(o.item)+' — '+esc(o.status)+(o.note?' ('+esc(o.note)+')':'')).join('; ')+'.</p>';
 route()}).catch(err=>{$('view').innerHTML='<div class="wait"><h2>Could not load the prediction data</h2><p>'+esc(err.message||err)+'</p><p class="sm">This page reads data/index.json and the day file beside it. Opened straight from disk, use the self-contained copy instead.</p></div>'});
}
</script>
</body>
